name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for Open3D and VTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgomp1 libxrender1 libxkbcommon-x11-0 xvfb
      - name: Install
        run: pip install -e ".[dev]"
      - name: Decoder, calibration and replay tests
        run: xvfb-run -a python -m pytest -q --timeout=300 -m "not slow"
      - name: The bundled clip decodes end to end
        run: helios16p-info --rec helios16p/data/walk_4s.npz --frames && helios16p-demo --viewer none --max-frames 5
